services:

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    networks:
      - arr
    ports:
      - "9696:9696"
    environment:
      - PUID=500
      - PGID=500
      - UMASK=002
      - TZ=Europe/London
    volumes:
      - ./prowlarr/config:/config
    restart: always

  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    networks:
      - arr
    environment:
      - PUID=500
      - PGID=500
      - TZ=Europe/London
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent/config:/config
      - downloads:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
  
  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:latest
    networks:
      - arr
    ports:
      - "8989:8989"
    environment:
      - PUID=500
      - PGID=500
      - UMASK=002
      - TZ=Europe/London
    volumes:
      - ./sonarr/config:/config
      - downloads:/downloads
      - tv:/TV
    restart: always

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    networks:
      - arr
    environment:
      - PUID=500
      - PGID=500
      - TZ=Europe/London
    volumes:
      - ./radarr/config:/config
      - movies:/movies
      - downloads:/downloads
    ports:
      - 7878:7878
    restart: always


networks:
  arr:
    name: arr

volumes:
  movies:
    driver_opts:
     type: none
     o: bind
     device: /mnt/media/Movies
  tv:
    driver_opts:
     type: none
     o: bind
     device: /mnt/media/TV
  downloads:
    driver_opts:
     type: none
     o: bind
     device: /mnt/media/Movies/downloads